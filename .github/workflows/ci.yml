name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: f1-rag:ci
          # load: true is required to make the built image available to the
          # Docker daemon for the size-check step below.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert image size under 10 GB
        run: |
          # cu130 torch + sentence-transformers + reranker + corpora puts
          # the runtime image at ~9.5 GB. 10 GB gives us headroom to catch
          # regressions without false positives.
          size_bytes=$(docker image inspect f1-rag:ci --format '{{.Size}}')
          size_gb=$(echo "scale=2; $size_bytes / 1073741824" | bc)
          echo "Image size: ${size_gb} GB (${size_bytes} bytes)"
          limit_bytes=10737418240  # 10 * 1024^3
          if [ "$size_bytes" -gt "$limit_bytes" ]; then
            echo "ERROR: image exceeds 10 GB limit (${size_gb} GB)" >&2
            exit 1
          fi
          echo "OK: image is within the 10 GB limit."
