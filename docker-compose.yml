services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./eval/results:/app/eval/results
    depends_on:
      - qdrant
      - langfuse
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: f1rag-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: f1rag-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: f1rag-langfuse
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme-in-env}
      SALT: ${LANGFUSE_SALT:-changeme-in-env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: f1rag
      LANGFUSE_INIT_ORG_NAME: f1rag
      LANGFUSE_INIT_PROJECT_ID: f1rag
      LANGFUSE_INIT_PROJECT_NAME: f1rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-admin@local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
  hf_cache:
